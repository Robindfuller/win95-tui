[package]
name = "win95"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = { version = "0.29", features = ["serde"] }
ego-tree = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
libc = "0.2.189"
portable-pty = "0.9.0"
ratatui = { version = "0.30", features = ["serde"] }
resvg = "0.48.1"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"
ureq = { version = "3.4.2", features = ["charset", "cookies"] }
url = "2.5.8"
vt100 = "0.16.2"
